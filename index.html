<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GameRec Pro</title>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }
  
  #splash-screen {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: url('image_341a8827.jpg') center/cover no-repeat;
    transition: opacity 1s ease-in-out;
  }
  #splash-screen::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.6); }
  .splash-text {
    font-size: 32px; font-weight: 900; color: #fff; text-align: center;
    text-shadow: 0 0 20px #ff007f, 0 0 40px #00d4ff;
    padding: 20px; animation: pulse 2s infinite alternate; position: relative; z-index: 2;
  }
  @keyframes pulse { from { transform: scale(0.95); } to { transform: scale(1.05); } }

  #main-app { display: none; flex-direction: column; height: 100vh; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; font-size: 20px; font-weight: bold; color: #20e58a; border-bottom: 1px solid #222; }
  
  .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  
  #facecam {
    position: absolute; top: 10px; right: 10px; width: 100px; height: 140px;
    border-radius: 15px; border: 3px solid #20e58a; background: #111;
    object-fit: cover; z-index: 10; display: none;
  }

  .record-btn { width: 90px; height: 90px; border-radius: 50%; background: #ff4d67; border: 6px solid #fff; box-shadow: 0 0 20px rgba(255,77,103,0.5); cursor: pointer; margin-top: 30px; }
  .record-btn:active { transform: scale(0.95); }
  .status { margin-top: 20px; font-size: 18px; color: #8ba6ab; font-weight: bold; }

  .reaction-btn { margin-top: 40px; padding: 15px 30px; border-radius: 12px; background: #20e58a; color: #000; font-weight: 900; border: none; font-size: 18px; display: none; }
</style>
</head>
<body>

  <div id="splash-screen">
    <div class="splash-text">Welcome to<br>kenney@2007</div>
  </div>

  <div id="main-app">
    <div class="header"><span>🎮 GameRec Pro</span></div>
    <div class="content">
      <video id="facecam" autoplay playsinline muted></video>
      <div id="statusText" class="status">Ready to Record</div>
      <button id="recordBtn" class="record-btn"></button>
      <button id="reactionBtn" class="reaction-btn">🎥 Record Face Reaction</button>
    </div>
  </div>

  <script>
    // 1. SPLASH SCREEN
    setTimeout(() => {
      document.getElementById('splash-screen').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('splash-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        startCamera();
      }, 1000);
    }, 3000);

    // 2. CAMERA
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        const videoElement = document.getElementById('facecam');
        videoElement.srcObject = stream;
        videoElement.style.display = 'block';
      } catch (e) {}
    }

    // 3. RECORDING LOGIC (NEW PLUGIN)
    let isRecording = false;
    let startTime;
    const recordBtn = document.getElementById('recordBtn');
    const statusText = document.getElementById('statusText');
    const reactionBtn = document.getElementById('reactionBtn');

    recordBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          statusText.innerText = "Starting...";
          recordBtn.style.background = '#555';
          
          await Capacitor.Plugins.ScreenRecorder.start({
            notificationTitle: "GameRec Pro",
            notificationText: "Recording your screen...",
            recordAudio: true,
            isAudio: true
          });

          isRecording = true;
          startTime = Date.now();
          updateTimer();
          
        } catch (e) {
          alert("Error: " + e.message);
          statusText.innerText = "Ready to Record";
          recordBtn.style.background = '#ff4d67';
        }
      } else {
        try {
          statusText.innerText = "Saving...";
          await Capacitor.Plugins.ScreenRecorder.stop();
          
          isRecording = false;
          statusText.innerText = "Saved! Tap Reaction to record face.";
          recordBtn.style.background = '#ff4d67';
          
          reactionBtn.style.display = 'block';
          alert("Game video saved!");
          
        } catch (e) {
          alert("Stop Error: " + e.message);
        }
      }
    });

    function updateTimer() {
      if (!isRecording) return;
      const seconds = Math.floor((Date.now() - startTime) / 1000);
      statusText.innerText = `🔴 Recording... ${seconds}s`;
      setTimeout(updateTimer, 1000);
    }

    // 4. REACTION CAMERA (Records your face to the gallery)
    reactionBtn.addEventListener('click', async () => {
        alert("Face Reaction recording started! (This uses the front camera and saves to gallery)");
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
            const mediaRecorder = new MediaRecorder(stream);
            const chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'face_reaction.webm';
                a.click();
                alert("Face reaction saved to downloads!");
            };
            mediaRecorder.start();
            setTimeout(() => { mediaRecorder.stop(); stream.getTracks().forEach(t=>t.stop()); }, 10000);
        } catch(e) { alert("Camera error: " + e.message); }
    });
  </script>
</body>
</html>
