<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GameRec Pro</title>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }
  
  #splash-screen {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: url('image_341a8827.jpg') center/cover no-repeat;
    transition: opacity 1s ease-in-out;
  }
  #splash-screen::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.6); }
  .splash-text {
    font-size: 32px; font-weight: 900; color: #fff; text-align: center;
    text-shadow: 0 0 20px #ff007f, 0 0 40px #00d4ff;
    padding: 20px; animation: pulse 2s infinite alternate; position: relative; z-index: 2;
  }
  @keyframes pulse { from { transform: scale(0.95); } to { transform: scale(1.05); } }

  #main-app { display: none; flex-direction: column; height: 100vh; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; font-size: 20px; font-weight: bold; color: #20e58a; border-bottom: 1px solid #222; }
  .settings-btn { background: #222; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-size: 16px; font-weight: bold; }
  
  .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  
  #facecam {
    position: absolute; top: 10px; right: 10px; width: 100px; height: 140px;
    border-radius: 15px; border: 3px solid #20e58a; background: #111;
    object-fit: cover; z-index: 10; display: none;
  }

  .record-btn { width: 90px; height: 90px; border-radius: 50%; background: #ff4d67; border: 6px solid #fff; box-shadow: 0 0 20px rgba(255,77,103,0.5); cursor: pointer; margin-top: 30px; }
  .record-btn:active { transform: scale(0.95); }
  .status { margin-top: 20px; font-size: 18px; color: #8ba6ab; font-weight: bold; }

  #settings-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; display: none; flex-direction: column; padding: 20px; box-sizing: border-box; }
  .settings-header { display: flex; justify-content: space-between; align-items: center; font-size: 22px; color: #20e58a; margin-bottom: 20px; }
  .close-settings { background: #333; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; font-size: 16px; }
  .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #333; font-size: 18px; }
  .setting-item input[type="checkbox"] { width: 24px; height: 24px; accent-color: #20e58a; }
</style>
</head>
<body>

  <div id="splash-screen">
    <div class="splash-text">Welcome to<br>kenney@2007</div>
  </div>

  <div id="settings-modal">
    <div class="settings-header">
      <span>⚙️ Settings</span>
      <button class="close-settings" id="close-settings-btn">Close</button>
    </div>
    <div class="setting-item"><span>Show Facecam Bubble</span><input type="checkbox" id="toggle-facecam" checked></div>
    <div class="setting-item"><span>Record Game Audio</span><input type="checkbox" id="toggle-audio" checked></div>
    <div class="setting-item"><span>Show Welcome Screen</span><input type="checkbox" id="toggle-splash" checked></div>
  </div>

  <div id="main-app">
    <div class="header">
      <span>🎮 GameRec Pro</span>
      <button class="settings-btn" id="open-settings-btn">⚙️ Settings</button>
    </div>
    <div class="content">
      <video id="facecam" autoplay playsinline muted></video>
      <div id="statusText" class="status">Ready to Record</div>
      <button id="recordBtn" class="record-btn"></button>
    </div>
  </div>

  <script src="capacitor.js"></script>
  <!-- THE PIPE: This loads app.js from GitHub so you never need a new APK -->
  <script src="https://raw.githubusercontent.com/kennedykingsman5-wel/GameRec/main/app.js"></script>
</body>
</html>
