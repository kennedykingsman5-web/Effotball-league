<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GameRec Pro</title>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .record-btn { width: 90px; height: 90px; border-radius: 50%; background: #ff4d67; border: 6px solid #fff; box-shadow: 0 0 20px rgba(255,77,103,0.5); cursor: pointer; margin-top: 20px; }
  .status { margin-top: 20px; font-size: 20px; color: #8ba6ab; font-weight: bold; }
</style>
</head>
<body>

  <h2>🎮 GameRec Pro</h2>
  <div id="statusText" class="status">Tap to record</div>
  <button id="recordBtn" class="record-btn"></button>

  <script>
    const recordBtn = document.getElementById('recordBtn');
    const statusText = document.getElementById('statusText');
    let isRecording = false;

    // Request Overlay Permission automatically on load
    async function requestOverlayPermission() {
      if (window.Android && window.Android.requestOverlayPermission) {
        window.Android.requestOverlayPermission();
      }
    }
    setTimeout(requestOverlayPermission, 1000);

    recordBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          statusText.innerText = "Requesting Mic/Camera...";
          
          // 1. Force Microphone and Camera Permissions
          await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
          
          statusText.innerText = "Starting Recorder...";
          
          // 2. Start Screen Recording with Audio
          await Capacitor.Plugins.ScreenRecorder.start({
            notificationTitle: "GameRec Pro is Recording",
            notificationText: "Tap to return to app and stop.",
            recordAudio: true,
            isAudio: true
          });

          // 3. Start the Native Floating Camera (The Facecam over the game!)
          if (window.Android && window.Android.startFloatingCamera) {
            window.Android.startFloatingCamera();
          }

          isRecording = true;
          statusText.innerText = "🔴 Recording! Minimize and play your game.";
          recordBtn.style.background = '#555';
          
        } catch (e) {
          alert("Failed to start: " + e.message);
          statusText.innerText = "Error: Check permissions.";
        }
      } else {
        statusText.innerText = "Saving...";
        await Capacitor.Plugins.ScreenRecorder.stop();
        
        if (window.Android && window.Android.stopFloatingCamera) {
          window.Android.stopFloatingCamera();
        }
        
        isRecording = false;
        statusText.innerText = "Saved to Gallery!";
        recordBtn.style.background = '#ff4d67';
        alert("Video with Audio + Facecam saved!");
      }
    });
  </script>
</body>
</html>
