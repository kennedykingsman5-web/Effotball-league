<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GameRec</title>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  .header { text-align: center; padding: 20px; font-size: 24px; font-weight: bold; color: #20e58a; }
  .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
  .record-btn { width: 100px; height: 100px; border-radius: 50%; background: #ff4d67; border: 6px solid #fff; box-shadow: 0 0 20px rgba(255,77,103,0.5); cursor: pointer; margin-top: 30px; transition: transform 0.1s; }
  .record-btn:active { transform: scale(0.95); }
  .record-btn.recording { background: #555; border-color: #ff4d67; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
  .status { margin-top: 20px; font-size: 18px; color: #8ba6ab; }
  .hidden { display: none; }
</style>
</head>
<body>

  <div class="header">GameRec</div>

  <div class="content">
    <div id="statusText" class="status">Ready to record</div>
    
    <button id="recordBtn" class="record-btn"></button>
  </div>

  <!-- Capacitor script -->
  <script src="capacitor.js"></script>
  <script src="app.js"></script>
</body>
</html>
